<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="sudip@bayonetarch terminal banner">
  <title>sudip@bayonetarch: ~</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sweepClip">
      <rect x="14" y="0" width="872" height="4" rx="2"/>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="298" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="14" y="1" width="872" height="3" rx="1.5" fill="url(#accent)"/>
  <rect x="2" y="2" width="896" height="70" fill="url(#fade)"/>

  <!-- title bar -->
  <line x1="1" y1="46" x2="899" y2="46" stroke="#21262d"/>
  <circle cx="26" cy="24" r="5.5" fill="#ff5f56"/>
  <circle cx="45" cy="24" r="5.5" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="5.5" fill="#27c93f"/>
  <text x="450" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6e7681">sudip@bayonetarch: ~</text>
  <circle cx="872" cy="24" r="4" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- body -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">

    <g opacity="0">
      <text x="34" y="88" fill="#7aa2f7">$</text>
      <text x="56" y="88" fill="#c0caf5">whoami</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.15s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="56" y="118" fill="#e6eaff">sudip</text>
      <text x="112" y="118" fill="#565f89">—</text>
      <text x="128" y="118" fill="#a9b1d6">full stack + systems, nepal</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.35s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="34" y="158" fill="#7aa2f7">$</text>
      <text x="56" y="158" fill="#c0caf5">cat ~/focus</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.6s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="56" y="188" fill="#9ece6a">readable code · honest benchmarks · fast tools</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.8s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="34" y="228" fill="#7aa2f7">$</text>
      <text x="56" y="228" fill="#c0caf5">ls ~/src</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="1.0s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="56" y="258" fill="#e6eaff">rust/</text>
      <text x="112" y="258" fill="#565f89">·</text>
      <text x="128" y="258" fill="#e6eaff">c/</text>
      <text x="152" y="258" fill="#565f89">·</text>
      <text x="168" y="258" fill="#e6eaff">typescript/</text>
      <text x="290" y="258" fill="#565f89">·</text>
      <text x="306" y="258" fill="#e6eaff">lua/</text>
      <text x="350" y="258" fill="#565f89">·</text>
      <text x="366" y="258" fill="#e6eaff">shell/</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="1.2s" fill="freeze"/>
    </g>

  </g>

  <!-- prompt + blinking block cursor -->
  <g opacity="0">
    <text x="34" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7aa2f7">$</text>
    <text x="56" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c0caf5">sudo ./build.sh</text>
    <rect x="228" y="274" width="10" height="18" rx="1.5" fill="#c0caf5">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" keyTimes="0;0.45;0.45;1" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="1.45s" fill="freeze"/>
  </g>

  <!-- slow shine across the top accent bar -->
  <g clip-path="url(#sweepClip)">
    <rect x="-160" y="0" width="160" height="4" fill="url(#sheen)">
      <animate attributeName="x" from="-160" to="1000" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
